<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Life Survey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="card">

      <header class="card-header">
        <p class="kicker">College Life Survey</p>
        <h1>Tell us about your college experience</h1>
        <p class="subhead">15 questions, shown 5 at a time. Answer as much as you'd like.</p>
      </header>

      <form id="survey-form" class="survey">

        <div class="question">
          <label class="q-label" for="name">
            Your name <span class="optional">(optional)</span>
          </label>
          <input type="text" id="name" name="name" placeholder="Jordan Lee">
        </div>

        <div class="survey-page" data-page="1">
          <div class="question">
            <label class="q-label" for="q1"><span class="q-num">1</span>How would you describe your college life so far?</label>
            <textarea id="q1" name="q1" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q2"><span class="q-num">2</span>What is the biggest challenge you face as a college student?</label>
            <textarea id="q2" name="q2" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q3"><span class="q-num">3</span>How do you manage your time between studying and personal life?</label>
            <textarea id="q3" name="q3" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q4"><span class="q-num">4</span>What is your favorite part about being in college?</label>
            <textarea id="q4" name="q4" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q5"><span class="q-num">5</span>What is the most difficult subject or experience you have encountered?</label>
            <textarea id="q5" name="q5" rows="3"></textarea>
          </div>
        </div>

        <div class="survey-page" data-page="2" hidden>
          <div class="question">
            <label class="q-label" for="q6"><span class="q-num">6</span>How do you deal with stress and pressure from school?</label>
            <textarea id="q6" name="q6" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q7"><span class="q-num">7</span>What motivates you to continue studying?</label>
            <textarea id="q7" name="q7" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q8"><span class="q-num">8</span>How has college changed you as a person?</label>
            <textarea id="q8" name="q8" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q9"><span class="q-num">9</span>What advice would you give to incoming college students?</label>
            <textarea id="q9" name="q9" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q10"><span class="q-num">10</span>What are your goals after finishing college?</label>
            <textarea id="q10" name="q10" rows="3"></textarea>
          </div>
        </div>

        <div class="survey-page" data-page="3" hidden>
          <div class="question">
            <label class="q-label" for="q11"><span class="q-num">11</span>How do you make friends and build relationships in college?</label>
            <textarea id="q11" name="q11" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q12"><span class="q-num">12</span>What is one memorable experience you have had in college?</label>
            <textarea id="q12" name="q12" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q13"><span class="q-num">13</span>Do you think college life is different from what you expected? Why?</label>
            <textarea id="q13" name="q13" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q14"><span class="q-num">14</span>How do you balance your school responsibilities and hobbies?</label>
            <textarea id="q14" name="q14" rows="3"></textarea>
          </div>
          <div class="question">
            <label class="q-label" for="q15"><span class="q-num">15</span>What skills have you learned from being a college student?</label>
            <textarea id="q15" name="q15" rows="3"></textarea>
          </div>
        </div>

        <div class="pager">
          <button type="button" id="back-btn" class="btn-secondary" hidden>Back</button>
          <span id="page-indicator" class="page-indicator">Page 1 of 3</span>
          <button type="button" id="next-btn" class="btn-primary">Next</button>
          <button type="submit" id="submit-btn" class="btn-primary" hidden>Send feedback</button>
        </div>

        <p id="form-status" class="status" aria-live="polite"></p>
      </form>

      <div id="thank-you" class="thank-you" hidden>
        <p class="kicker">Done</p>
        <h2>Thanks, that's saved.</h2>
        <p class="subhead">We appreciate you taking the time.</p>
      </div>

    </div>

    <p class="footer-link"><a href="responses.html">View collected responses →</a></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
